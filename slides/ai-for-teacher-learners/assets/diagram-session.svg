<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="session-workspace-title session-workspace-desc">
  <title id="session-workspace-title">Session：這次一起工作的桌子</title>
  <desc id="session-workspace-desc">用工作桌的比喻，說明 Session 會保留這次對話中的背景、問題、結果與後續追問。</desc>
  <defs>
    <marker id="session-workspace-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#57534E"/>
    </marker>
    <style>
      .body { font-family: 'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
      .mono { font-family: Consolas, 'Noto Sans TC', monospace; }
    </style>
  </defs>

  <rect width="1600" height="820" fill="#ffffff"/>
  <text x="100" y="88" class="body" fill="#1C1917" font-size="38" font-weight="600">Session：這次一起工作的桌子</text>
  <text x="100" y="130" class="body" fill="#57534E" font-size="21">坐在同一張桌子旁，Agent 才知道前面說過什麼、現在要做什麼。</text>

  <g class="body">
    <rect x="560" y="156" width="480" height="128" rx="6" fill="#EFE2D4" stroke="#9A6846" stroke-width="1.4"/>
    <text x="800" y="205" text-anchor="middle" class="mono" fill="#9A6846" font-size="17" letter-spacing="0.12em">SESSION</text>
    <text x="800" y="248" text-anchor="middle" fill="#1C1917" font-size="32" font-weight="600">這次協作的工作桌</text>

    <!-- The Session is the shared workspace; the conversation then moves left to right. -->
    <path d="M800 284 V360 H260 M800 360 H1340" stroke="#D6D3D1" stroke-width="1.2" fill="none"/>
    <path d="M260 360 V420 M1340 360 V420" stroke="#D6D3D1" stroke-width="1.2" fill="none"/>

    <g transform="translate(100 442)">
      <rect width="320" height="150" rx="6" fill="#ffffff" stroke="#D6D3D1"/>
      <text x="28" y="52" fill="#1C1917" font-size="26" font-weight="600">你先說背景</text>
      <text x="28" y="94" fill="#57534E" font-size="19">我們要做什麼？</text>
      <text x="28" y="122" fill="#57534E" font-size="17">已經知道哪些事情？</text>
    </g>
    <g transform="translate(460 442)">
      <rect width="320" height="150" rx="6" fill="#ffffff" stroke="#D6D3D1"/>
      <text x="28" y="52" fill="#1C1917" font-size="26" font-weight="600">你提出問題</text>
      <text x="28" y="94" fill="#57534E" font-size="19">想先弄懂哪裡？</text>
      <text x="28" y="122" fill="#57534E" font-size="17">可以一題一題問</text>
    </g>
    <g transform="translate(820 442)">
      <rect width="320" height="150" rx="6" fill="#ffffff" stroke="#D6D3D1"/>
      <text x="28" y="52" fill="#1C1917" font-size="26" font-weight="600">Agent 回答</text>
      <text x="28" y="94" fill="#57534E" font-size="19">整理內容、給出結果</text>
      <text x="28" y="122" fill="#57534E" font-size="17">你可以檢查它說得對不對</text>
    </g>
    <g transform="translate(1180 442)">
      <rect width="320" height="150" rx="6" fill="#ffffff" stroke="#D6D3D1"/>
      <text x="28" y="52" fill="#1C1917" font-size="26" font-weight="600">你再確認</text>
      <text x="28" y="94" fill="#57534E" font-size="19">繼續、修改或追問</text>
      <text x="28" y="122" fill="#57534E" font-size="17">這些也會留在這張桌子上</text>
    </g>
  </g>

  <g stroke="#57534E" stroke-width="1.2" fill="none" marker-end="url(#session-workspace-arrow)">
    <path d="M420 517 H460"/>
    <path d="M780 517 H820"/>
    <path d="M1140 517 H1180"/>
  </g>

  <rect x="260" y="690" width="1080" height="52" rx="6" fill="#F5F5F4" stroke="#E7E5E4"/>
  <text x="800" y="723" text-anchor="middle" class="body" fill="#1C1917" font-size="21">換到另一張 Session，就像換一張桌子：前面的對話不一定還在。</text>
</svg>
