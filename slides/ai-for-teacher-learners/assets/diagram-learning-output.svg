<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="learning-output-preview-title learning-output-preview-desc">
  <title id="learning-output-preview-title">把筆記整理成一張能核對的知識圖</title>
  <desc id="learning-output-preview-desc">先從認知負荷理論筆記找出工作記憶、外在負荷和教學做法的關係，再以相同概念寫成 ASCII 草稿並畫成知識圖。</desc>
  <defs>
    <marker id="learning-output-preview-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#57534E"/>
    </marker>
    <style>
      .body { font-family: 'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
      .mono { font-family: Consolas, 'Noto Sans TC', monospace; }
    </style>
  </defs>

  <rect width="1600" height="820" fill="#ffffff"/>
  <text x="100" y="78" class="body" fill="#1C1917" font-size="38" font-weight="600">把筆記整理成一張能核對的知識圖</text>
  <text x="100" y="120" class="body" fill="#57534E" font-size="21">先讀懂原文，再用文字排出關係，最後把同一條關係畫出來。</text>

  <!-- One sequential learning path; connectors are behind the cards. -->
  <g stroke="#57534E" stroke-width="1.4" fill="none" marker-end="url(#learning-output-preview-arrow)">
    <line x1="500" y1="424" x2="574" y2="424"/>
    <line x1="1026" y1="424" x2="1100" y2="424"/>
  </g>

  <g class="body">
    <rect x="100" y="190" width="400" height="480" rx="6" fill="#ffffff" stroke="#D6D3D1"/>
    <text x="132" y="246" fill="#1C1917" font-size="28" font-weight="600">01　完整筆記</text>
    <text x="132" y="283" class="mono" fill="#A8A29E" font-size="16">notes/cognitive-load-theory.md</text>
    <line x1="132" y1="310" x2="468" y2="310" stroke="#E7E5E4"/>
    <text x="132" y="358" fill="#1C1917" font-size="21" font-weight="600">從原文節錄一條關係</text>
    <text x="132" y="400" fill="#57534E" font-size="19">工作記憶容量有限。</text>
    <text x="132" y="448" fill="#57534E" font-size="19">教學要避免不必要的</text>
    <text x="132" y="476" fill="#57534E" font-size="19">外在負荷。</text>
    <text x="132" y="524" fill="#57534E" font-size="19">例如拆開步驟、</text>
    <text x="132" y="552" fill="#57534E" font-size="19">標出關鍵資訊。</text>
    <text x="132" y="630" fill="#A8A29E" font-size="17">原筆記仍保留完整解釋與例子</text>

    <rect x="574" y="190" width="452" height="480" rx="6" fill="#EFE2D4" stroke="#9A6846" stroke-width="1.4"/>
    <text x="606" y="246" fill="#9A6846" font-size="28" font-weight="600">02　ASCII 草稿</text>
    <text x="606" y="283" fill="#57534E" font-size="18">先用純文字檢查概念與關係</text>
    <line x1="606" y1="310" x2="994" y2="310" stroke="#E2D3C0"/>
    <text x="610" y="370" class="mono" fill="#1C1917" font-size="21">工作記憶容量有限</text>
    <text x="630" y="412" class="mono" fill="#9A6846" font-size="18">↓ 教學設計要留意</text>
    <text x="610" y="454" class="mono" fill="#1C1917" font-size="21">避免不必要的外在負荷</text>
    <text x="630" y="496" class="mono" fill="#9A6846" font-size="18">↓ 例如</text>
    <text x="610" y="538" class="mono" fill="#1C1917" font-size="21">拆開步驟、標出關鍵資訊</text>
    <text x="606" y="630" fill="#A8A29E" font-size="17">確認無誤後再保存到 outputs/</text>

    <rect x="1100" y="190" width="400" height="480" rx="6" fill="#ffffff" stroke="#D6D3D1"/>
    <text x="1132" y="246" fill="#1C1917" font-size="28" font-weight="600">03　知識圖</text>
    <text x="1132" y="283" fill="#57534E" font-size="18">用方塊與箭頭重畫同一條關係</text>
    <line x1="1132" y1="310" x2="1468" y2="310" stroke="#E7E5E4"/>

    <g stroke="#57534E" stroke-width="1.3" fill="none" marker-end="url(#learning-output-preview-arrow)">
      <line x1="1300" y1="396" x2="1300" y2="428"/>
      <line x1="1300" y1="500" x2="1300" y2="532"/>
    </g>
    <rect x="1150" y="342" width="300" height="54" rx="6" fill="#1C1917"/>
    <text x="1300" y="376" text-anchor="middle" fill="#ffffff" font-size="19">工作記憶容量有限</text>
    <rect x="1142" y="428" width="316" height="72" rx="6" fill="#F5F5F4" stroke="#D6D3D1"/>
    <text x="1300" y="454" text-anchor="middle" fill="#57534E" font-size="15">教學設計要留意</text>
    <text x="1300" y="480" text-anchor="middle" fill="#1C1917" font-size="18">避免不必要的外在負荷</text>
    <rect x="1136" y="532" width="328" height="74" rx="6" fill="#F5F5F4" stroke="#D6D3D1"/>
    <text x="1300" y="558" text-anchor="middle" fill="#57534E" font-size="15">例如</text>
    <text x="1300" y="584" text-anchor="middle" fill="#1C1917" font-size="18">拆開步驟、標出關鍵資訊</text>
  </g>

  <rect x="180" y="712" width="1240" height="64" rx="6" fill="#F5F5F4" stroke="#E7E5E4"/>
  <text x="800" y="752" text-anchor="middle" class="body" fill="#1C1917" font-size="21">檢查重點：圖中的每個概念與箭頭，都找得到筆記與 ASCII 草稿的根據嗎？</text>
</svg>
