<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>三國人物關係圖</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif+TC:wght@400&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#5a6580; --rule:rgba(45,49,66,.16); --accent:#bf4520; --accent-tint:rgba(191,69,32,.08); --link:#2e5aa8; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:'Geist','Noto Sans TC','PingFang TC',sans-serif; }
    main { max-width:2060px; margin:0 auto; padding:36px 42px 44px; }
    .eyebrow { color:var(--soft); font:500 11px 'Geist Mono',ui-monospace,monospace; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:8px 0 4px; font:400 42px 'Instrument Serif','Noto Serif TC',serif; letter-spacing:.01em; }
    .dek { margin:0 0 22px; color:var(--muted); font-size:14px; }
    .frame { border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); padding:22px 0 12px; }
    svg { display:block; width:100%; height:auto; overflow:visible; }
    .node-title { font:600 18px 'Geist','Noto Sans TC',sans-serif; fill:var(--ink); }
    .node-sub { font:400 11px 'Geist Mono',ui-monospace,monospace; fill:var(--muted); }
    .tag { font:500 9px 'Geist Mono',ui-monospace,monospace; letter-spacing:.12em; fill:var(--soft); }
    .edge-label { font:500 10px 'Noto Sans TC','Geist',sans-serif; fill:var(--soft); }
    .legend { display:flex; gap:28px; align-items:center; flex-wrap:wrap; margin-top:14px; color:var(--muted); font-size:12px; }
    .legend span { display:inline-flex; align-items:center; gap:8px; }
    .swatch { width:24px; height:0; border-top:1.5px solid var(--muted); }
    .swatch.event { width:14px; height:14px; border:1px solid var(--accent); background:var(--accent-tint); }
    .note { margin:18px 0 0; color:var(--muted); font-size:12px; line-height:1.7; }
    .source-index { margin-top:12px; display:flex; flex-wrap:wrap; gap:6px 14px; color:var(--soft); font:400 11px 'Geist Mono',ui-monospace,monospace; }
    @media (max-width:900px) { main{padding:24px 16px}.frame{overflow-x:auto} svg{min-width:1200px} }
  </style>
</head>
<body>
<main>
  <div class="eyebrow">RELATION MAP · CARD-SOURCED</div>
  <h1>三國人物關係圖</h1>
  <p class="dek">只呈現「人物」與「事件」卡片中明確寫出的關係；每條連線旁標示其來源卡片。</p>
  <div class="frame">
    <svg viewBox="0 0 1960 1120" role="img" aria-labelledby="three-kingdoms-title three-kingdoms-desc">
      <title id="three-kingdoms-title">三國人物關係圖</title>
      <desc id="three-kingdoms-desc">五位人物與桃園結義、煮酒論英雄、赤壁之戰三個事件的卡片來源關係圖。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
      </defs>
      <!-- connectors: all routes are orthogonal and labels sit on masked open segments -->
      <g fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)" stroke-linejoin="round">
        <!-- 桃園結義 -->
        <path d="M340 164 H520 V168 H1420"/>
        <path d="M340 324 H560 V184 H1420"/>
        <path d="M340 484 H600 V200 H1420"/>
        <!-- 煮酒論英雄 -->
        <path d="M340 180 H680 V488 H1420"/>
        <path d="M340 340 H720 V504 H1420"/>
        <path d="M340 500 H760 V520 H1420"/>
        <path d="M340 660 H800 V536 H1420"/>
        <!-- 赤壁之戰 -->
        <path d="M340 196 H840 V816 H1420"/>
        <path d="M340 356 H880 V832 H1420"/>
        <path d="M340 516 H920 V848 H1420"/>
        <path d="M340 676 H960 V864 H1420"/>
        <path d="M340 836 H1000 V880 H1420"/>
      </g>

      <!-- edge source labels; each name is the exact card filename stem -->
      <g text-anchor="middle">
        <g><rect x="406" y="138" width="128" height="18" rx="3" fill="#f5f5f5"/><text x="470" y="151" class="edge-label">劉備.md／桃園結義.md</text></g>
        <g><rect x="438" y="218" width="128" height="18" rx="3" fill="#f5f5f5"/><text x="502" y="231" class="edge-label">關羽.md／桃園結義.md</text></g>
        <g><rect x="478" y="298" width="128" height="18" rx="3" fill="#f5f5f5"/><text x="542" y="311" class="edge-label">張飛.md／桃園結義.md</text></g>
        <g><rect x="500" y="244" width="128" height="18" rx="3" fill="#f5f5f5"/><text x="564" y="257" class="edge-label">劉備.md／煮酒論英雄.md</text></g>
        <g><rect x="544" y="380" width="128" height="18" rx="3" fill="#f5f5f5"/><text x="608" y="393" class="edge-label">曹操.md／煮酒論英雄.md</text></g>
        <g><rect x="590" y="456" width="128" height="18" rx="3" fill="#f5f5f5"/><text x="654" y="469" class="edge-label">關羽.md／煮酒論英雄.md</text></g>
        <g><rect x="632" y="580" width="128" height="18" rx="3" fill="#f5f5f5"/><text x="696" y="593" class="edge-label">張飛.md／煮酒論英雄.md</text></g>
        <g><rect x="700" y="700" width="128" height="18" rx="3" fill="#f5f5f5"/><text x="764" y="713" class="edge-label">劉備.md／赤壁之戰.md</text></g>
        <g><rect x="744" y="764" width="128" height="18" rx="3" fill="#f5f5f5"/><text x="808" y="777" class="edge-label">孫權.md／赤壁之戰.md</text></g>
        <g><rect x="790" y="812" width="128" height="18" rx="3" fill="#f5f5f5"/><text x="854" y="825" class="edge-label">曹操.md／赤壁之戰.md</text></g>
        <g><rect x="836" y="872" width="128" height="18" rx="3" fill="#f5f5f5"/><text x="900" y="885" class="edge-label">關羽.md／赤壁之戰.md</text></g>
        <g><rect x="884" y="944" width="128" height="18" rx="3" fill="#f5f5f5"/><text x="948" y="957" class="edge-label">張飛.md／赤壁之戰.md</text></g>
      </g>

      <!-- person nodes -->
      <g>
        <g><rect x="80" y="132" width="260" height="72" rx="6" fill="#ffffff" stroke="#2d3142"/><rect x="92" y="142" width="46" height="16" rx="2" fill="none" stroke="#2d3142" stroke-opacity=".4"/><text x="115" y="154" text-anchor="middle" class="tag">PERSON</text><text x="210" y="172" text-anchor="middle" class="node-title">劉備</text><text x="210" y="190" text-anchor="middle" class="node-sub">人物／蜀漢</text></g>
        <g><rect x="80" y="292" width="260" height="72" rx="6" fill="#ffffff" stroke="#2d3142"/><rect x="92" y="302" width="46" height="16" rx="2" fill="none" stroke="#2d3142" stroke-opacity=".4"/><text x="115" y="314" text-anchor="middle" class="tag">PERSON</text><text x="210" y="332" text-anchor="middle" class="node-title">曹操</text><text x="210" y="350" text-anchor="middle" class="node-sub">人物／曹魏基業</text></g>
        <g><rect x="80" y="452" width="260" height="72" rx="6" fill="#ffffff" stroke="#2d3142"/><rect x="92" y="462" width="46" height="16" rx="2" fill="none" stroke="#2d3142" stroke-opacity=".4"/><text x="115" y="474" text-anchor="middle" class="tag">PERSON</text><text x="210" y="492" text-anchor="middle" class="node-title">關羽</text><text x="210" y="510" text-anchor="middle" class="node-sub">人物／劉備義弟</text></g>
        <g><rect x="80" y="612" width="260" height="72" rx="6" fill="#ffffff" stroke="#2d3142"/><rect x="92" y="622" width="46" height="16" rx="2" fill="none" stroke="#2d3142" stroke-opacity=".4"/><text x="115" y="634" text-anchor="middle" class="tag">PERSON</text><text x="210" y="652" text-anchor="middle" class="node-title">張飛</text><text x="210" y="670" text-anchor="middle" class="node-sub">人物／劉備義弟</text></g>
        <g><rect x="80" y="772" width="260" height="72" rx="6" fill="#ffffff" stroke="#2d3142"/><rect x="92" y="782" width="46" height="16" rx="2" fill="none" stroke="#2d3142" stroke-opacity=".4"/><text x="115" y="794" text-anchor="middle" class="tag">PERSON</text><text x="210" y="812" text-anchor="middle" class="node-title">孫權</text><text x="210" y="830" text-anchor="middle" class="node-sub">人物／東吳</text></g>
      </g>

      <!-- event nodes -->
      <g>
        <g><rect x="1420" y="116" width="420" height="112" rx="6" fill="#f5f5f5"/><rect x="1420" y="116" width="420" height="112" rx="6" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width="1.2"/><rect x="1436" y="130" width="54" height="16" rx="2" fill="none" stroke="#bf4520" stroke-opacity=".65"/><text x="1463" y="142" text-anchor="middle" class="tag" fill="#bf4520">EVENT</text><text x="1630" y="172" text-anchor="middle" class="node-title">桃園結義</text><text x="1630" y="194" text-anchor="middle" class="node-sub">第 1 回／中平元年／結義</text><text x="1630" y="214" text-anchor="middle" class="node-sub">3 位人物卡＋事件卡</text></g>
        <g><rect x="1420" y="436" width="420" height="112" rx="6" fill="#f5f5f5"/><rect x="1420" y="436" width="420" height="112" rx="6" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width="1.2"/><rect x="1436" y="450" width="54" height="16" rx="2" fill="none" stroke="#bf4520" stroke-opacity=".65"/><text x="1463" y="462" text-anchor="middle" class="tag" fill="#bf4520">EVENT</text><text x="1630" y="492" text-anchor="middle" class="node-title">煮酒論英雄</text><text x="1630" y="514" text-anchor="middle" class="node-sub">第 21 回／對話</text><text x="1630" y="534" text-anchor="middle" class="node-sub">4 位人物卡＋事件卡</text></g>
        <g><rect x="1420" y="756" width="420" height="112" rx="6" fill="#f5f5f5"/><rect x="1420" y="756" width="420" height="112" rx="6" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width="1.2"/><rect x="1436" y="770" width="54" height="16" rx="2" fill="none" stroke="#bf4520" stroke-opacity=".65"/><text x="1463" y="782" text-anchor="middle" class="tag" fill="#bf4520">EVENT</text><text x="1630" y="812" text-anchor="middle" class="node-title">赤壁之戰</text><text x="1630" y="834" text-anchor="middle" class="node-sub">第 49 回／對抗</text><text x="1630" y="854" text-anchor="middle" class="node-sub">5 位人物卡＋事件卡</text></g>
      </g>

      <line x1="80" y1="930" x2="1840" y2="930" stroke="#2d3142" stroke-opacity=".12"/>
      <text x="80" y="962" fill="#4f5d75" font-size="11" font-family="'Geist Mono',ui-monospace,monospace" letter-spacing=".14em">CARD SET</text>
      <text x="80" y="988" fill="#5a6580" font-size="12" font-family="'Geist Mono',ui-monospace,monospace">人物／劉備.md　孫權.md　張飛.md　曹操.md　關羽.md</text>
      <text x="80" y="1012" fill="#5a6580" font-size="12" font-family="'Geist Mono',ui-monospace,monospace">關係／桃園結義.md　煮酒論英雄.md　赤壁之戰.md</text>
      <text x="80" y="1050" fill="#4f5d75" font-size="11" font-family="'Geist Mono',ui-monospace,monospace" letter-spacing=".12em">READING KEY</text>
      <line x1="220" y1="1046" x2="260" y2="1046" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="274" y="1050" fill="#5a6580" font-size="12" font-family="'Noto Sans TC','Geist',sans-serif">連線方向：人物 → 事件；線旁文字為來源卡片</text>
    </svg>
  </div>
  <div class="legend"><span><i class="swatch"></i>人物 → 事件（卡片明載）</span><span><i class="swatch event"></i>事件節點</span></div>
  <p class="note">註：同一人物—事件配對若同時出現在人物卡與關係卡，線旁以「人物卡／事件卡」並列標示。未列入卡片明確關係的其他人物、勢力或事件沒有補畫。</p>
  <div class="source-index">來源：人物/*.md · 關係/*.md</div>
</main>
</body>
</html>
