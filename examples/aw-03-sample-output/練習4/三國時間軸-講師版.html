<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三國時間軸</title>
<style>
  :root {
    --bg: #f7f5f0;
    --panel: #ffffff;
    --ink: #1c1917;
    --muted: #57534e;
    --faint: #a8a29e;
    --rule: #e7e5e4;
    --accent: #b45309;
    --accent-soft: #fef3c7;
    --dim: #d6d3d1;
    --shadow: 0 1px 2px rgba(28, 25, 23, .06), 0 6px 18px rgba(28, 25, 23, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12110f;
      --panel: #1c1a17;
      --ink: #f5f5f4;
      --muted: #c8c3bd;
      --faint: #78716c;
      --rule: #2e2b27;
      --accent: #f59e0b;
      --accent-soft: #3a2a0c;
      --dim: #3f3a35;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12110f;
    --panel: #1c1a17;
    --ink: #f5f5f4;
    --muted: #c8c3bd;
    --faint: #78716c;
    --rule: #2e2b27;
    --accent: #f59e0b;
    --accent-soft: #3a2a0c;
    --dim: #3f3a35;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .35);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    line-height: 1.6;
  }
  header { max-width: 1200px; margin: 0 auto; padding: 32px 16px 8px; }
  h1 { margin: 0; font-size: 30px; letter-spacing: .02em; }
  .sub { margin: 6px 0 0; color: var(--muted); font-size: 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 18px; }
  .bar button {
    font: inherit; font-size: 15px; color: var(--ink); background: var(--panel);
    border: 1px solid var(--rule); padding: 6px 14px; border-radius: 999px; cursor: pointer;
  }
  .bar button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .bar .spacer { flex: 1; }
  .hint { color: var(--faint); font-size: 14px; }

  main { max-width: 1200px; margin: 0 auto; padding: 8px 16px 40px; }
  .viewport {
    position: relative; overflow-x: auto; overflow-y: hidden;
    background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; box-shadow: var(--shadow);
    cursor: grab; user-select: none; -webkit-user-select: none; touch-action: pan-y;
    scrollbar-width: thin;
  }
  .viewport.dragging { cursor: grabbing; }
  .track { position: relative; height: 380px; }
  .axis { position: absolute; left: 0; right: 0; top: 236px; height: 4px; background: var(--accent); border-radius: 2px; }
  .tick { position: absolute; top: 236px; width: 1px; height: 12px; background: var(--faint); }
  .tick.major { height: 20px; }
  .tick-label { position: absolute; top: 330px; transform: translateX(-50%); color: var(--faint); font-size: 13px; white-space: nowrap; }

  .ev { position: absolute; top: 0; height: 100%; width: 0; }
  .ev .stem { position: absolute; left: -1px; width: 2px; background: var(--accent); opacity: .55; }
  .ev .dot {
    position: absolute; left: -10px; top: 228px; width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent); border: 4px solid var(--panel); box-shadow: 0 0 0 2px var(--accent);
  }
  .ev .name {
    position: absolute; transform: translateX(-50%); white-space: nowrap;
    background: var(--accent-soft); color: var(--ink); border: 1px solid var(--accent);
    padding: 6px 14px; border-radius: 10px; font-size: 19px; font-weight: 600; cursor: pointer;
  }
  .ev .when { position: absolute; top: 258px; transform: translateX(-50%); text-align: center; white-space: nowrap; font-size: 15px; line-height: 1.4; color: var(--muted); }
  .ev .when b { display: block; color: var(--accent); font-weight: 600; font-size: 16px; }
  .ev.off .name { background: transparent; border-color: var(--dim); color: var(--faint); }
  .ev.off .dot { background: var(--dim); box-shadow: 0 0 0 2px var(--dim); }
  .ev.off .stem { background: var(--dim); }
  .ev.off .when, .ev.off .when b { color: var(--faint); }
  .ev.active .name { background: var(--accent); color: #fff; }

  .overview { position: relative; height: 36px; margin-top: 14px; cursor: pointer; touch-action: none; }
  .overview .line { position: absolute; left: 0; right: 0; top: 17px; height: 2px; background: var(--rule); }
  .overview .mini { position: absolute; top: 12px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--accent); }
  .overview .mini.off { background: var(--dim); }
  .overview .window { position: absolute; top: 0; height: 36px; border: 2px solid var(--accent); border-radius: 8px; background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .ov-labels { display: flex; justify-content: space-between; color: var(--faint); font-size: 13px; margin-top: 2px; }

  .detail {
    margin-top: 20px; background: var(--panel); border: 1px solid var(--rule); border-radius: 14px;
    padding: 16px 20px; box-shadow: var(--shadow); min-height: 92px;
  }
  .detail h2 { margin: 0 0 4px; font-size: 20px; }
  .detail p { margin: 2px 0; color: var(--muted); font-size: 16px; }
  .sources { margin-top: 24px; color: var(--muted); font-size: 15px; }
  .sources h3 { font-size: 16px; color: var(--ink); margin: 0 0 6px; }
  .sources ul { margin: 0; padding-left: 20px; }
</style>
</head>
<body>
<header>
  <h1>三國時間軸</h1>
  <p class="sub">《三國演義》共 120 回。事件依回目排在線上；年份只寫卡片有寫的。</p>
  <div class="bar" role="toolbar" aria-label="篩選與操作">
    <button type="button" data-who="" aria-pressed="true">全部事件</button>
    <button type="button" data-who="劉備" aria-pressed="false">只看劉備</button>
    <span class="spacer"></span>
    <span class="hint">按住拖曳，或用下方總覽跳到任何一段</span>
    <button type="button" id="theme" aria-label="切換深色或淺色">深／淺色</button>
  </div>
</header>
<main>
  <div class="viewport" id="viewport" tabindex="0" aria-label="可左右拖曳的時間軸">
    <div class="track" id="track"><div class="axis"></div></div>
  </div>
  <div class="overview" id="overview" aria-label="完整時間軸總覽"><div class="line"></div><div class="window" id="window"></div></div>
  <div class="ov-labels"><span>第 1 回</span><span>第 60 回</span><span>第 120 回</span></div>
  <section class="detail" id="detail" aria-live="polite">
    <h2>點一個事件，看參與人物和來源卡</h2>
    <p>拖曳時間軸可以看到第 1 回到第 120 回的完整範圍。</p>
  </section>
  <section class="sources">
    <h3>來源卡</h3>
    <ul id="sources"></ul>
  </section>
</main>
<script>
  // 每件事都照 關係/ 裡的卡片抄：回目、年份（卡片沒寫就空著）、參與人物。
  const EVENTS = [
    { n: 1, name: '桃園結義', year: '中平元年', people: ['劉備', '關羽', '張飛'], card: '桃園結義.md' },
    { n: 5, name: '三英戰呂布', year: '', people: ['劉備', '關羽', '張飛', '呂布', '公孫瓚'], card: '三英戰呂布.md' },
    { n: 19, name: '白門樓', year: '', people: ['曹操', '劉備', '關羽', '張飛', '呂布', '陳宮', '高順', '侯成', '宋憲', '魏續'], card: '白門樓.md' },
    { n: 21, name: '煮酒論英雄', year: '', people: ['曹操', '劉備'], card: '煮酒論英雄.md' },
    { n: 46, name: '草船借箭', year: '', people: ['周瑜', '諸葛亮', '魯肅', '曹操'], card: '草船借箭.md' },
    { n: 49, name: '赤壁之戰', year: '', people: ['孫權', '曹操', '劉備', '關羽', '張飛'], card: '赤壁之戰.md' },
  ];
  const TOTAL = 120;
  const PER = 52;
  const PAD = 110;
  const NAME_TOP = [60, 140];

  const viewport = document.getElementById('viewport');
  const track = document.getElementById('track');
  const overview = document.getElementById('overview');
  const win = document.getElementById('window');
  const detail = document.getElementById('detail');
  const x = n => PAD + (n - 1) * PER;
  track.style.width = (x(TOTAL) + PAD) + 'px';

  for (let n = 1; n <= TOTAL; n++) {
    if (n % 5 !== 0) continue;
    const major = n % 10 === 0;
    const t = document.createElement('div');
    t.className = 'tick' + (major ? ' major' : '');
    t.style.left = x(n) + 'px';
    track.appendChild(t);
    if (major) {
      const l = document.createElement('div');
      l.className = 'tick-label';
      l.style.left = x(n) + 'px';
      l.textContent = '第 ' + n + ' 回';
      track.appendChild(l);
    }
  }

  const nodes = EVENTS.map((e, i) => {
    const top = NAME_TOP[i % 2];
    const el = document.createElement('div');
    el.className = 'ev';
    el.style.left = x(e.n) + 'px';
    el.innerHTML =
      '<div class="stem" style="top:' + (top + 20) + 'px;height:' + (228 - top - 20) + 'px"></div>' +
      '<button type="button" class="name" style="top:' + top + 'px"></button>' +
      '<div class="dot"></div>' +
      '<div class="when"><b>第 ' + e.n + ' 回</b>' + (e.year || '') + '</div>';
    el.querySelector('.name').textContent = e.name;
    el.querySelector('.name').addEventListener('click', () => show(i));
    track.appendChild(el);

    const m = document.createElement('div');
    m.className = 'mini';
    m.style.left = ((e.n - 1) / (TOTAL - 1) * 100) + '%';
    overview.appendChild(m);
    return { el, m };
  });

  const list = document.getElementById('sources');
  EVENTS.forEach(e => {
    const li = document.createElement('li');
    li.textContent = e.name + '：' + e.card;
    list.appendChild(li);
  });

  function show(i) {
    const e = EVENTS[i];
    nodes.forEach((nd, j) => nd.el.classList.toggle('active', j === i));
    detail.innerHTML = '<h2></h2><p></p><p></p>';
    detail.querySelector('h2').textContent = '第 ' + e.n + ' 回　' + e.name + (e.year ? '（' + e.year + '）' : '');
    detail.querySelectorAll('p')[0].textContent = '參與人物：' + e.people.join('、');
    detail.querySelectorAll('p')[1].textContent = '來源卡：' + e.card;
  }

  // 篩選：只看某個人時，其他事件變淡，但時間軸長度不變，還是看得到完整範圍。
  document.querySelectorAll('[data-who]').forEach(b => b.addEventListener('click', () => {
    const who = b.dataset.who;
    document.querySelectorAll('[data-who]').forEach(o => o.setAttribute('aria-pressed', String(o === b)));
    EVENTS.forEach((e, i) => {
      const off = who && !e.people.includes(who);
      nodes[i].el.classList.toggle('off', !!off);
      nodes[i].m.classList.toggle('off', !!off);
    });
  }));

  // 拖曳：按住時間軸左右拉。
  let drag = null;
  viewport.addEventListener('pointerdown', ev => {
    if (ev.target.closest('.name')) return;
    drag = { x: ev.clientX, left: viewport.scrollLeft };
    viewport.classList.add('dragging');
    viewport.setPointerCapture(ev.pointerId);
  });
  viewport.addEventListener('pointermove', ev => {
    if (!drag) return;
    viewport.scrollLeft = drag.left - (ev.clientX - drag.x);
  });
  const stop = () => { drag = null; viewport.classList.remove('dragging'); };
  viewport.addEventListener('pointerup', stop);
  viewport.addEventListener('pointercancel', stop);
  viewport.addEventListener('wheel', ev => {
    if (Math.abs(ev.deltaY) > Math.abs(ev.deltaX)) { viewport.scrollLeft += ev.deltaY; ev.preventDefault(); }
  }, { passive: false });
  viewport.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowRight') viewport.scrollLeft += 200;
    if (ev.key === 'ArrowLeft') viewport.scrollLeft -= 200;
  });

  // 總覽：整條 120 回縮成一行，框起來的是目前看到的範圍；點或拖都能跳過去。
  function syncWindow() {
    const w = track.offsetWidth;
    win.style.left = (viewport.scrollLeft / w * 100) + '%';
    win.style.width = (viewport.clientWidth / w * 100) + '%';
  }
  function jump(ev) {
    const r = overview.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width));
    viewport.scrollLeft = ratio * track.offsetWidth - viewport.clientWidth / 2;
  }
  let ovDrag = false;
  overview.addEventListener('pointerdown', ev => { ovDrag = true; overview.setPointerCapture(ev.pointerId); jump(ev); });
  overview.addEventListener('pointermove', ev => { if (ovDrag) jump(ev); });
  overview.addEventListener('pointerup', () => { ovDrag = false; });
  overview.addEventListener('pointercancel', () => { ovDrag = false; });
  viewport.addEventListener('scroll', syncWindow);
  window.addEventListener('resize', syncWindow);
  syncWindow();

  const root = document.documentElement;
  document.getElementById('theme').addEventListener('click', () => {
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
  });
</script>
</body>
</html>
